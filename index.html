<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d">
<title>A VOLTA POR CIMA | Estudos PMPE</title>
<style>
:root{--bg:#0b1511;--panel:#14251d;--panel2:#1b3026;--line:#2c4939;--gold:#d6b56d;--text:#f2f4ef;--muted:#a9b8ad;--green:#6db58b;--red:#e58c82}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1511,#101e17 60%,#0a130f);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--panel2);color:var(--text)}button:hover{border-color:var(--gold)}button.primary{background:var(--gold);color:#172018;border-color:var(--gold);font-weight:700}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:#0d1b14;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:8px 10px 24px}.brand small{color:var(--gold);letter-spacing:2px;font-weight:800}.brand h1{font-size:22px;line-height:1.1;margin:7px 0}.brand p{color:var(--muted);font-size:12px;margin:0}
nav{display:grid;gap:6px}nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}nav button.active,nav button:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.top h2{margin:0;font-size:25px}.top p{margin:4px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(145deg,var(--panel),#112019);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}.stat{grid-column:span 3}.wide{grid-column:span 8}.side{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:1/-1}
.label{color:var(--muted);font-size:13px}.number{font-size:28px;font-weight:800;margin:4px 0}.gold{color:var(--gold)}h3{margin:0 0 12px;font-size:17px}.muted{color:var(--muted)}.bar{height:9px;background:#263b30;border-radius:99px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0}
.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #263b30}.item:last-child{border:0}.item strong{display:block}.item small{color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted);white-space:nowrap}
input,textarea,select{width:100%;background:#0d1b14;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:110px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.subject{display:flex;flex-direction:column;gap:9px}.subject select{margin-top:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.question{padding:15px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.option{display:block;text-align:left;width:100%;margin:7px 0;background:#0e1b14}.option.chosen{border-color:var(--gold)}.feedback{padding:12px;border-radius:10px;background:#20382b;margin-top:10px}
.timer{font-size:48px;font-weight:800;letter-spacing:2px;text-align:center;margin:15px}.center{text-align:center}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#1a2c22;border-radius:7px;color:#dce5dc;font-size:13px}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:5px 8px 12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px}.stat{grid-column:span 6}.wide,.side,.half{grid-column:1/-1}main{padding:18px}.top{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.stat{grid-column:1/-1}.formrow{grid-template-columns:1fr}.timer{font-size:38px}}
</style></head>
<body><div class="app">
<aside><div class="brand"><small>PLATAFORMA DE ESTUDOS</small><h1>A VOLTA<br>POR CIMA</h1><p>Preparação PMPE • Soldado</p></div>
<nav id="nav">
<button class="active" data-page="inicio">⌂ Visão geral</button><button data-page="cronograma">▦ Cronograma</button><button data-page="materias">▤ Matérias</button><button data-page="questoes">✓ Questões</button><button data-page="erros">⚑ Caderno de erros</button><button data-page="revisoes">↻ Revisões</button><button data-page="ferramentas">◷ Ferramentas</button><button data-page="anotacoes">✎ Anotações</button><button data-page="desempenho">▥ Desempenho</button><button data-page="backup">⇧ Backup</button>
</nav></aside>
<main><div class="top"><div><h2 id="pageTitle">Visão geral</h2><p id="today"></p></div><div class="actions"><button onclick="showPage('backup')">Backup</button><button class="primary" onclick="showPage('cronograma')">Estudar agora</button></div></div>
<div id="content"></div><footer>Feito para manter a constância. Um dia de cada vez.</footer></main></div>
<script>
const KEY='avolta_pmpe_v1';
const initial={
 subjects:[
 {name:'Língua Portuguesa',topics:['Compreensão e interpretação de textos','Informações explícitas e implícitas / inferência','Tema, assunto e ideia principal','Tese e argumentos','Fato e opinião','Coerência e coesão','Conectivos','Acentuação','Substantivo','Ortografia','Pronomes'],status:'Estudando'},
 {name:'Raciocínio Lógico',topics:['Proposições simples e compostas','Conectivos lógicos','Tabela-verdade do conectivo E','Quantificadores lógicos','Diagramas lógicos'],status:'Estudando'},
 {name:'Direito Constitucional',topics:['Constituição Federal: direitos e garantias fundamentais','Administração Pública: art. 37','Direitos do preso e dignidade da pessoa humana'],status:'Não iniciado'},
 {name:'Direitos Humanos',topics:['Teoria Geral dos Direitos Humanos'],status:'Estudando'},
 {name:'Informática',topics:['Internet, intranet e extranet','Navegadores','Endereço web','HTTP e HTTPS'],status:'Estudando'},
 {name:'Legislação Penal Especial',topics:['Abuso de autoridade','Lei de Tortura'],status:'Estudando'},
 {name:'Legislação Institucional PMPE',topics:['Conferir e cadastrar tópicos conforme edital oficial'],status:'Não iniciado'},
 {name:'Direito Penal',topics:['Cadastrar tópicos conforme edital oficial'],status:'Não iniciado'},
 {name:'Direito Processual Penal',topics:['Cadastrar tópicos conforme edital oficial'],status:'Não iniciado'},
 {name:'Redação',topics:['Estrutura básica: introdução, desenvolvimento e conclusão','Conectivos: porém, portanto, além disso e assim'],status:'Estudando'}
 ],
 schedule:[
 {day:'Segunda-feira',subject:'Língua Portuguesa',time:'',done:false},{day:'Terça-feira',subject:'Raciocínio Lógico',time:'',done:false},
 {day:'Quarta-feira',subject:'Direitos Humanos / Constitucional',time:'',done:false},{day:'Quinta-feira',subject:'Língua Portuguesa',time:'',done:false},
 {day:'Sexta-feira',subject:'Raciocínio Lógico',time:'',done:false},{day:'Sábado',subject:'Informática / Legislação',time:'',done:false},{day:'Domingo',subject:'Revisão e questões',time:'',done:false}
 ], notes:'', errors:[], revisions:[], sessions:0, minutes:0, answers:[],lastTopic:''
};
let data=load();
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPage(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const names={inicio:'Visão geral',cronograma:'Cronograma de estudos',materias:'Matérias e tópicos',questoes:'Banco de questões',erros:'Caderno de erros',revisoes:'Revisões',ferramentas:'Ferramentas de estudo',anotacoes:'Anotações',desempenho:'Desempenho',backup:'Backup e dados'};document.getElementById('pageTitle').textContent=names[p];({inicio:home,cronograma:schedule,materias:subjects,questoes:questions,erros:errors,revisoes:revisions,ferramentas:tools,anotacoes:notes,desempenho:performance,backup:backup}[p]||home)();window.scrollTo(0,0)}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)showPage(b.dataset.page)});
document.getElementById('today').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date());
function stats(){let all=data.subjects.reduce((n,s)=>n+s.topics.length,0),done=data.subjects.reduce((n,s)=>n+s.topicsDone?.length||0,0);return {all,done,percent:all?Math.round(done/all*100):0}}
function home(){let s=stats(),done=data.schedule.filter(x=>x.done).length;document.getElementById('content').innerHTML=`
<div class="grid"><div class="card stat"><div class="label">Matérias cadastradas</div><div class="number">${data.subjects.length}</div><small class="muted">Disciplinas do seu painel</small></div>
<div class="card stat"><div class="label">Tópicos concluídos</div><div class="number">${s.done}</div><small class="muted">De ${s.all} cadastrados</small></div>
<div class="card stat"><div class="label">Aproveitamento</div><div class="number">${accuracy()}%</div><small class="muted">Nas questões respondidas</small></div>
<div class="card stat"><div class="label">Tempo registrado</div><div class="number">${Math.floor(data.minutes/60)}h ${data.minutes%60}m</div><small class="muted">Sessões de estudo</small></div>
<div class="card wide"><h3>Progresso dos tópicos</h3><div class="number gold">${s.percent}%</div><div class="bar"><span style="width:${s.percent}%"></span></div><p class="muted">Marque cada tópico como concluído na área Matérias.</p></div>
<div class="card side"><h3>Atalhos</h3><div class="list"><div class="item"><span>Continuar estudos</span><button onclick="showPage('materias')">Abrir</button></div><div class="item"><span>Fazer questões</span><button onclick="showPage('questoes')">Abrir</button></div><div class="item"><span>Revisar conteúdo</span><button onclick="showPage('revisoes')">Abrir</button></div></div></div>
<div class="card full"><h3>Plano semanal</h3>${data.schedule.map((x,i)=>`<div class="item"><div><strong>${x.day}</strong><small>${esc(x.subject)} ${x.time?' • '+esc(x.time):''}</small></div><label style="margin:0"><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="toggleSchedule(${i},this.checked)"> Concluído</label></div>`).join('')}</div>
<div class="card full notice">Atenção: os tópicos iniciais refletem conteúdos já trabalhados nas conversas e uma estrutura de organização. Confira e complete a relação de disciplinas e assuntos usando o edital oficial vigente da PMPE antes de considerar o painel como edital verticalizado completo.</div></div>`}
function toggleSchedule(i,v){data.schedule[i].done=v;save();home()}
function schedule(){document.getElementById('content').innerHTML=`<div class="card"><h3>Organize sua semana</h3><p class="muted">Edite as disciplinas e horários. Marque o que concluiu.</p>${data.schedule.map((x,i)=>`<div class="formrow item"><div><label>${x.day}</label><input value="${esc(x.subject)}" onchange="data.schedule[${i}].subject=this.value;save()"></div><div><label>Horário</label><input placeholder="Ex.: 19:00" value="${esc(x.time)}" onchange="data.schedule[${i}].time=this.value;save()"><label><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="data.schedule[${i}].done=this.checked;save()"> Concluído</label></div></div>`).join('')}<button class="primary" onclick="save();alert('Cronograma salvo!')">Salvar cronograma</button></div>`}
function subjects(){document.getElementById('content').innerHTML=`<div class="grid">${data.subjects.map((s,i)=>`<div class="card half subject"><h3>${esc(s.name)}</h3><select onchange="data.subjects[${i}].status=this.value;save()">${['Não iniciado','Estudando','Concluído'].map(v=>`<option ${s.status===v?'selected':''}>${v}</option>`).join('')}</select><div class="list">${s.topics.map((t,j)=>`<label class="item"><span>${esc(t)}</span><input style="width:auto" type="checkbox" ${(s.topicsDone||[]).includes(j)?'checked':''} onchange="markTopic(${i},${j},this.checked)"></label>`).join('')}</div><button onclick="addTopic(${i})">+ Adicionar tópico</button></div>`).join('')}
<div class="card full"><h3>Adicionar disciplina</h3><div class="formrow"><input id="newSubject" placeholder="Nome da disciplina"><button class="primary" onclick="addSubject()">Adicionar matéria</button></div></div></div>`}
function markTopic(i,j,v){let a=data.subjects[i].topicsDone||[];data.subjects[i].topicsDone=v?[...new Set([...a,j])]:a.filter(x=>x!==j);save();subjects()}
function addTopic(i){let t=prompt('Nome do novo tópico:');if(t){data.subjects[i].topics.push(t);save();subjects()}}
function addSubject(){let n=document.getElementById('newSubject').value.trim();if(n){data.subjects.push({name:n,topics:[],status:'Não iniciado'});save();subjects()}}
const bank=[
{subject:'Língua Portuguesa',q:'Em um texto, a ideia principal corresponde:',opts:['A um detalhe isolado.','À informação central desenvolvida pelo texto.','Sempre à primeira frase.','À opinião do leitor.','A qualquer palavra repetida.'],a:1,why:'A ideia principal sintetiza o núcleo de sentido do texto; não precisa estar literalmente na primeira frase.'},
{subject:'Raciocínio Lógico',q:'Na conjunção lógica P ∧ Q, o resultado é verdadeiro quando:',opts:['P é verdadeira ou Q é verdadeira.','Ambas são falsas.','P e Q são verdadeiras.','P é falsa e Q verdadeira.','Sempre que P for verdadeira.'],a:2,why:'A conjunção (E) só é verdadeira quando as duas proposições são verdadeiras.'},
{subject:'Informática',q:'A principal finalidade do HTTPS é:',opts:['Eliminar a necessidade de navegador.','Oferecer comunicação criptografada entre cliente e servidor.','Garantir que todo site seja verdadeiro.','Aumentar a memória do computador.','Bloquear todos os cookies.'],a:1,why:'HTTPS utiliza criptografia na comunicação, mas não garante por si só que o conteúdo do site seja confiável.'},
{subject:'Direitos Humanos',q:'A dignidade da pessoa humana é entendida como:',opts:['Um benefício concedido apenas a nacionais.','Um fundamento que orienta a proteção da pessoa.','Um direito exclusivo de pessoas presas.','Uma regra aplicável somente em conflitos.','Uma faculdade que pode ser retirada livremente.'],a:1,why:'A dignidade é um fundamento central da proteção dos direitos humanos e da ordem constitucional.'}
];let qi=0,selected=null;
function questions(){let q=bank[qi%bank.length];document.getElementById('content').innerHTML=`<div class="card"><div class="tabs"><span class="tag">${q.subject}</span><span class="tag">Questão de treino</span></div><h3>Questão ${qi+1} de treino</h3><p>${q.q}</p>${q.opts.map((o,i)=>`<button class="option ${selected===i?'chosen':''}" onclick="selected=${i};questions()">${'ABCDE'[i]}) ${o}</button>`).join('')}<div class="actions"><button class="primary" onclick="answer()">Responder</button><button onclick="qi++;selected=null;questions()">Pular</button></div><div id="feedback"></div><p class="notice">Banco inicial demonstrativo. Acrescente questões e confira o conteúdo com o edital e materiais oficiais. Não representa prova oficial da AOCP.</p></div>`}
function answer(){if(selected===null){alert('Selecione uma alternativa.');return}let q=bank[qi%bank.length],ok=selected===q.a;data.answers.push({subject:q.subject,ok});if(!ok)data.errors.push({q:q.q,chosen:'ABCDE'[selected],correct:'ABCDE'[q.a],why:q.why});save();document.getElementById('feedback').innerHTML=`<div class="feedback"><strong>${ok?'Resposta correta!':'Resposta incorreta.'}</strong><p>Gabarito: ${'ABCDE'[q.a]}. ${q.why}</p><button onclick="qi++;selected=null;questions()">Próxima questão</button></div>`}
function errors(){document.getElementById('content').innerHTML=`<div class="card"><h3>Questões para revisar</h3>${data.errors.length?data.errors.map((e,i)=>`<div class="question"><strong>${esc(e.q)}</strong><p>Sua resposta: ${e.chosen} • Correta: ${e.correct}</p><p>${esc(e.why)}</p><button onclick="data.errors.splice(${i},1);save();errors()">Remover após revisar</button></div>`).join(''):'<p class="muted">Nenhum erro registrado. Responda às questões para alimentar esta área.</p>'}</div>`}
function revisions(){document.getElementById('content').innerHTML=`<div class="card"><h3>Agenda de revisões</h3><p class="muted">Cadastre o conteúdo estudado e a data para revisar.</p><div class="formrow"><input id="revTopic" placeholder="Conteúdo para revisar"><input id="revDate" type="date"></div><button class="primary" onclick="addRevision()">Adicionar revisão</button><div class="list" style="margin-top:15px">${data.revisions.map((r,i)=>`<div class="item"><div><strong>${esc(r.topic)}</strong><small>${esc(r.date||'Sem data')}</small></div><button onclick="data.revisions.splice(${i},1);save();revisions()">Concluída</button></div>`).join('')||'<p class="muted">Nenhuma revisão agendada.</p>'}</div><p class="notice">Sugestão de ciclo: revisar em 24 horas, 7 dias e 30 dias. Cadastre as datas conforme seu ritmo.</p></div>`}
function addRevision(){let t=document.getElementById('revTopic').value.trim(),d=document.getElementById('revDate').value;if(t){data.revisions.push({topic:t,date:d});save();revisions()}}
let timer=null,remaining=25*60;
function tools(){document.getElementById('content').innerHTML=`<div class="grid"><div class="card half center"><h3>Pomodoro • 25 minutos</h3><div class="timer" id="clock">${fmt(remaining)}</div><div class="actions" style="justify-content:center"><button class="primary" onclick="startTimer()">Iniciar</button><button onclick="pauseTimer()">Pausar</button><button onclick="resetTimer()">Zerar</button></div><p class="muted">Ao concluir, registre sua sessão de estudo.</p></div><div class="card half"><h3>Registrar estudo</h3><label>Minutos estudados</label><input id="mins" type="number" min="1" value="25"><button class="primary" style="margin-top:12px" onclick="logStudy()">Registrar sessão</button><p class="muted">Total registrado: ${data.sessions} sessões • ${data.minutes} minutos.</p></div></div>`}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function startTimer(){if(timer)return;timer=setInterval(()=>{remaining=Math.max(0,remaining-1);let el=document.getElementById('clock');if(el)el.textContent=fmt(remaining);if(!remaining){pauseTimer();alert('Pomodoro concluído!');}},1000)}
function pauseTimer(){clearInterval(timer);timer=null}
function resetTimer(){pauseTimer();remaining=25*60;let el=document.getElementById('clock');if(el)el.textContent=fmt(remaining)}
function logStudy(){let n=Number(document.getElementById('mins').value);if(n>0){data.sessions++;data.minutes+=n;save();tools();}}
function notes(){document.getElementById('content').innerHTML=`<div class="card"><h3>Meu caderno de anotações</h3><textarea id="notesText" placeholder="Escreva suas anotações, dúvidas e lembretes...">${esc(data.notes)}</textarea><button class="primary" style="margin-top:12px" onclick="data.notes=document.getElementById('notesText').value;save();alert('Anotações salvas!')">Salvar anotações</button></div>`}
function accuracy(){return data.answers.length?Math.round(data.answers.filter(x=>x.ok).length/data.answers.length*100):0}
function performance(){let good=data.answers.filter(x=>x.ok).length;document.getElementById('content').innerHTML=`<div class="grid"><div class="card stat"><div class="label">Questões respondidas</div><div class="number">${data.answers.length}</div></div><div class="card stat"><div class="label">Acertos</div><div class="number">${good}</div></div><div class="card stat"><div class="label">Erros</div><div class="number">${data.answers.length-good}</div></div><div class="card stat"><div class="label">Aproveitamento</div><div class="number">${accuracy()}%</div></div><div class="card full"><h3>Resumo</h3><div class="bar"><span style="width:${accuracy()}%"></span></div><p class="muted">O desempenho é calculado com base nas questões respondidas dentro deste site. Use simulados adicionais para uma avaliação mais ampla.</p></div></div>`}
function backup(){document.getElementById('content').innerHTML=`<div class="grid"><div class="card half"><h3>Exportar seus dados</h3><p class="muted">Baixe um arquivo JSON com cronograma, progresso, anotações, erros e revisões.</p><button class="primary" onclick="exportData()">Baixar backup</button></div><div class="card half"><h3>Importar backup</h3><p class="muted">Selecione um backup JSON criado por este site. A importação substitui os dados atuais.</p><input type="file" id="backupFile" accept=".json,application/json"><button style="margin-top:10px" onclick="importData()">Importar backup</button></div><div class="card full notice"><strong>Privacidade e armazenamento:</strong> esta versão salva os dados no armazenamento local deste navegador/dispositivo. Limpar os dados do navegador pode apagar seu progresso. Faça backups regulares. Para sincronizar entre dispositivos, será necessário integrar um banco de dados e autenticação.</div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-a-volta-por-cima.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let f=document.getElementById('backupFile').files[0];if(!f)return alert('Escolha um arquivo.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects||!x.schedule)throw Error();data={...initial,...x};save();alert('Backup importado!');showPage('inicio')}catch(e){alert('Arquivo inválido ou incompatível.')}};r.readAsText(f)}
showPage('inicio');
</script></body></html>
